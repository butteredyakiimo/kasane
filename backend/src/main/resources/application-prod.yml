spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  open-in-view: false
  h2:
    console:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
