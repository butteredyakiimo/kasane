spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  open-in-view: false
  h2:
    console:
      enabled: false

server:
  # Behind caddy: Tomcat's RemoteIpValve rewrites getRemoteAddr() from X-Forwarded-For,
  # but only when the immediate peer is a private/internal address (the Docker network),
  # so a client-supplied header can't spoof the rate limiter's key.
  forward-headers-strategy: native

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
