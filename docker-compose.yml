# Docker keeps container logs forever by default - cap them so they can't slowly fill
# the VPS disk (a full disk takes Postgres down with it). Up to 3 x 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    container_name: kasane-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: kasane
      POSTGRES_USER: kasane
      # Default is a throwaway local-dev value
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-kasane}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kasane-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasane -d kasane"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    profiles: ["full"]
    build:
      context: ./backend
    container_name: kasane-app
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/kasane
      DATABASE_USER: kasane
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-kasane}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # Loopback only - public traffic goes through caddy (HTTPS). Still reachable
    # from the host itself for `curl localhost:8080` sanity checks.
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    profiles: ["full"]
    image: caddy:2
    container_name: kasane-caddy
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - app
    environment:
      # Public hostname for the API (DNS A record -> this VPS). Caddy fetches and
      # renews its Let's Encrypt cert automatically. Unset = local self-signed cert.
      API_DOMAIN: ${API_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  kasane-db-data:
  caddy-data:
  caddy-config:
